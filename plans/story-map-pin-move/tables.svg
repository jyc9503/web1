  <rect class="n start" x="240" y="30" width="170" height="56" rx="8"/><text x="325" y="54" text-anchor="middle">MapScene</text><text class="sm" x="325" y="72" text-anchor="middle">연출 맵 · SceneID</text>
  <rect class="n" x="680" y="30" width="170" height="56" rx="8"/><text x="765" y="54" text-anchor="middle">MapBackground</text><text class="sm" x="765" y="72" text-anchor="middle">배경 · BgID</text>
