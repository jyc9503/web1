<svg viewBox="0 0 880 340" role="img" aria-label="데이터 구조: 스토리 테이블 행이 story_resource_list 등록 id로 연출 JSON을 가리킨다. 연출 JSON은 장소 JSON과 앞 연출을 등록 id로 가리키고, 핀은 Actor 테이블을, 웨이포인트는 장소 JSON의 장소를 가리킨다. 장소 JSON은 배경 리소스를 가리킨다. 연출 JSON, 장소 JSON, 배경 이미지는 모두 story_resource_list에 등록한다">
  <defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>

  <rect class="n" x="20" y="30" width="170" height="56" rx="8" stroke-dasharray="4 3"/><text x="105" y="54" text-anchor="middle">스토리 테이블</text><text class="sm" x="105" y="72" text-anchor="middle">기존 (회사) · 열 2개 추가</text>
  <rect class="n" x="690" y="30" width="170" height="56" rx="8" stroke-dasharray="4 3"/><text x="775" y="54" text-anchor="middle">story_resource_list</text><text class="sm" x="775" y="72" text-anchor="middle">기존 (회사) · 리소스 등록</text>

  <rect class="n good" x="320" y="120" width="200" height="186" rx="8"/>
  <text x="336" y="144">연출 JSON</text><text class="sm" x="412" y="144">연출 1건 = 파일 1개</text>
  <rect class="n" x="334" y="156" width="172" height="40" rx="6"/><text x="346" y="181">pins[]</text><text class="sm" x="396" y="181">핀 · 속도 · 출발</text>
  <rect class="n" x="334" y="204" width="172" height="40" rx="6"/><text x="346" y="229">waypoints[]</text><text class="sm" x="432" y="229">경로 점</text>
  <rect class="n" x="334" y="252" width="172" height="40" rx="6"/><text x="346" y="277">places[]</text><text class="sm" x="408" y="277">장소 보임</text>

  <rect class="n good" x="690" y="170" width="170" height="56" rx="8"/><text x="775" y="194" text-anchor="middle">장소 JSON</text><text class="sm" x="775" y="212" text-anchor="middle">배경 + 장소 목록</text>
  <rect class="n" x="20" y="180" width="170" height="56" rx="8" stroke-dasharray="4 3"/><text x="105" y="204" text-anchor="middle">Actor 테이블</text><text class="sm" x="105" y="222" text-anchor="middle">기존 (회사) · 이름 · 리소스</text>

  <path class="e" d="M190 58C270 58 300 90 360 118" marker-end="url(#ar2)"/><text class="sm" x="262" y="48" text-anchor="middle">map_scene_resource_id</text>
  <path class="e" d="M500 120C500 96 548 96 548 122" marker-end="url(#ar2)" stroke-dasharray="5 4"/><text class="sm" x="556" y="104">prev_scene_resource_id (이어가기)</text>
  <path class="e" d="M520 160C600 160 640 180 688 192" marker-end="url(#ar2)" stroke-dasharray="5 4"/><text class="sm" x="604" y="152" text-anchor="middle">place_resource_id</text>
