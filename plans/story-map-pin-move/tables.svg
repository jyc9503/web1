<svg viewBox="0 0 880 372" role="img" aria-label="데이터 구조: 스토리 테이블 행이 map_scene을 가리키고, map_scene은 story_resource_list(배경)와 앞 연출, 연출 JSON을 가리킨다. 연출 JSON 안의 핀과 웨이포인트는 Actor 테이블과 map_place를 id로 참조한다. map_place는 story_resource_list의 배경에 속한다">
  <defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>

  <rect class="n" x="20" y="40" width="170" height="56" rx="8" stroke-dasharray="4 3"/><text x="105" y="64" text-anchor="middle">스토리 테이블</text><text class="sm" x="105" y="82" text-anchor="middle">기존 (회사) · 열 2개 추가</text>
  <rect class="n start" x="320" y="40" width="200" height="56" rx="8"/><text x="420" y="64" text-anchor="middle">map_scene</text><text class="sm" x="420" y="82" text-anchor="middle">엑셀 · 연출 맵 머리 · id</text>
  <rect class="n" x="690" y="40" width="170" height="56" rx="8" stroke-dasharray="4 3"/><text x="775" y="64" text-anchor="middle">story_resource_list</text><text class="sm" x="775" y="82" text-anchor="middle">기존 (회사) · 맵 배경 포함</text>

  <rect class="n good" x="320" y="150" width="200" height="186" rx="8"/>
  <text x="336" y="174">연출 JSON</text><text class="sm" x="412" y="174">연출 1건 = 파일 1개</text>
  <rect class="n" x="334" y="186" width="172" height="40" rx="6"/><text x="346" y="211">pins[]</text><text class="sm" x="396" y="211">핀 · 속도 · 출발</text>
  <rect class="n" x="334" y="234" width="172" height="40" rx="6"/><text x="346" y="259">waypoints[]</text><text class="sm" x="432" y="259">경로 점</text>
  <rect class="n" x="334" y="282" width="172" height="40" rx="6"/><text x="346" y="307">places[]</text><text class="sm" x="408" y="307">장소 보임</text>

  <rect class="n" x="690" y="170" width="170" height="56" rx="8"/><text x="775" y="194" text-anchor="middle">map_place</text><text class="sm" x="775" y="212" text-anchor="middle">엑셀 · 장소 마크 · id</text>
  <rect class="n" x="20" y="180" width="170" height="56" rx="8" stroke-dasharray="4 3"/><text x="105" y="204" text-anchor="middle">Actor 테이블</text><text class="sm" x="105" y="222" text-anchor="middle">기존 (회사) · 이름 · 리소스</text>
  <rect class="n mid" x="20" y="270" width="170" height="56" rx="8"/><text x="105" y="294" text-anchor="middle">map_config</text><text class="sm" x="105" y="312" text-anchor="middle">엑셀 · 튜닝 값 · key</text>

  <path class="e" d="M190 68H318" marker-end="url(#ar2)"/><text class="sm" x="254" y="58" text-anchor="middle">link_map_scene_id</text>
  <path class="e" d="M520 68H688" marker-end="url(#ar2)"/><text class="sm" x="604" y="58" text-anchor="middle">link_story_resource_list_id</text>
  <path class="e" d="M392 40C392 10 448 10 448 38" marker-end="url(#ar2)"/><text class="sm" x="462" y="22">link_prev_map_scene_id (이어가기)</text>
  <path class="e" d="M420 96V148" marker-end="url(#ar2)"/><text class="sm" x="428" y="126">scene_json</text>
  <path class="e" d="M775 170V98" marker-end="url(#ar2)"/><text class="sm" x="767" y="138" text-anchor="end">link_story_resource_list_id</text>
  <path class="e" d="M520 198H688" marker-end="url(#ar2)" stroke-dasharray="5 4"/><text class="sm" x="604" y="190" text-anchor="middle">place_id</text>
  <path class="e" d="M320 208H192" marker-end="url(#ar2)" stroke-dasharray="5 4"/><text class="sm" x="256" y="200" text-anchor="middle">actor_id</text>

  <text class="sm" x="20" y="360">실선: 엑셀의 link 열 · 점선: JSON 안의 id 참조 · 점선 상자: 회사 기존 테이블</text>
</svg>
