  <text class="sm" x="20" y="330">실선: 스토리 테이블 열 · 점선: JSON 안의 id 참조 · 점선 상자: 회사 기존 테이블 · 연출 JSON·장소 JSON·배경은 모두 story_resource_list에 등록</text>
