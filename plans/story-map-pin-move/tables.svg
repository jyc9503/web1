<svg viewBox="0 0 870 310" role="img" aria-label="맵 연출 테이블 관계도: 스토리 테이블이 MapScene을 부르고, MapScene은 MapBackground와 앞 연출을 참조하며, MapPin·MapWaypoint·MapScenePlace가 MapScene에 속하고, 웨이포인트와 장소 등장은 MapPlace를 참조한다">
